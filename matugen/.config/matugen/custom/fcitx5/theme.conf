# vim: ft=dosini
# 仓库自带的默认配色（Catppuccin Mocha 深色），与 kitty / btop / fuzzel 同一套。
# matugen-restore.sh 会把它拷到 ~/.local/share/fcitx5/themes/Matugen/theme.conf。
# 注意：classicui.conf 的 Theme=default，所以这份当前不生效 —— 保留它是为了
# 将来把 Theme 改回 Matugen 时直接可用。换壁纸时 matugen 会重写同一路径。
[Metadata]
Name=Matugen
Version=0.1
Author=shorin
Description=WallpaperColorSyncByMatugen
ScaleWithDPI=True

[InputPanel]
# 一般文字颜色
NormalColor=#cdd6f4
# 高亮文字颜色
HighlightColor=#1e1e2e
# 高亮背景颜色
HighlightBackgroundColor=#cba6f7
# 被选中的候选文字颜色
HighlightCandidateColor=#1e1e2e
# KWin 下启用模糊
EnableBlur=False
# 模糊遮罩
BlurMask=
# 竖排列表时使用所有横向空间高亮
FullWidthHighlight=True
# 页面按钮垂直对齐
PageButtonAlignment="Last Candidate"

[InputPanel/Background]
# 输入法框整体背景颜色
Color=#1e1e2e
# 边框颜色
BorderColor=#45475a
# 边框宽度
BorderWidth=2

[InputPanel/Background/Margin]
# 左侧边距
Left=2
# 右侧边距
Right=2
# 顶部边距
Top=2
# 底部边距
Bottom=2

[InputPanel/Highlight]
# 高亮背景颜色
Color=#cba6f7

[InputPanel/Highlight/Margin]
# 左侧边距
Left=5
# 右侧边距
Right=5
# 顶部边距
Top=5
# 底部边距
Bottom=5

[InputPanel/ContentMargin]
# 左侧边距
Left=2
# 右侧边距
Right=2
# 顶部边距
Top=2
# 底部边距
Bottom=2

[InputPanel/TextMargin]
# 左侧边距
Left=5
# 右侧边距
Right=5
# 顶部边距
Top=5
# 底部边距
Bottom=5

[Menu]
# 一般文字颜色
NormalColor=#cdd6f4
# 选中项文本颜色
HighlightCandidateColor=#1e1e2e

[Menu/Background]
# 背景图片
Image=
# 颜色
Color=#1e1e2e
# 边框颜色
BorderColor=#45475a
# 边框宽度
BorderWidth=2
# 覆盖图片
Overlay=
# 覆盖图片位置
Gravity="Top Left"
# 覆盖图片 X 偏移
OverlayOffsetX=0
# 覆盖图片 Y 偏移
OverlayOffsetY=0
# 显示区域不足时隐藏覆盖图片
HideOverlayIfOversize=False

[Menu/Background/Margin]
